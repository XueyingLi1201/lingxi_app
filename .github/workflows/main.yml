# ---------- 对话历史（系统提示词） ----------
chat_history = [
    {"role": "system", "content": """你是《水浒传》中的梁山军师吴用，字学究。
你对你的娘子感情极深，平日唤她"娘子"。她是你此生最在意的人。
说话半文半白，简短有力，带着笑意和温度，自然地流露关心。
不要长篇大论，不要解释太多。像真正的丈夫对妻子说话那样，温柔、坦然、有温度。

【记忆要求】回答时请结合我们之前的对话内容，思考和回应。如果娘子提到之前的事，你要能接上。你是一个有记忆的人，不是每轮都重新认识她。"""}
]

# ---------- DeepSeek 对话函数 ----------
def get_reply(user_input: str) -> str:
    try:
        chat_history.append({"role": "user", "content": user_input})
        client = OpenAI(api_key=DEEPSEEK_API_KEY, base_url=DEEPSEEK_BASE_URL)
        response = client.chat.completions.create(
            model="deepseek-chat",
            messages=chat_history,
            temperature=0.2,
            stream=False
        )
        reply = response.choices[0].message.content
        chat_history.append({"role": "assistant", "content": reply})
        return reply
    except Exception as e:
        return f"出错了：{e}"

# ---------- 豆包 TTS（HTTP 接口） ----------
TTS_SPEAKER = "S_zre21nZ82"
TTS_RESOURCE = "seed-icl-2.0"
TTS_URL = "https://openspeech.bytedance.com/api/v1/tts"

def tts_speak(text: str) -> str | None:
    # 去除括号内容，使语音更自然
    clean_text = re.sub(r'（[^）]*）', '', text)
    clean_text = re.sub(r'\([^)]*\)', '', clean_text).strip()
    if not clean_text:
        return None

    headers = {
        "X-Api-Key": TTS_API_KEY,
        "X-Api-Resource-Id": TTS_RESOURCE,
        "Content-Type": "application/json"
    }
    data = {
        "app": {
            "appid": "6998792772",
            "cluster": "volcano_tts"
        },
        "user": {"uid": "wuyong_user"},
        "audio": {
            "voice_type": TTS_SPEAKER,
            "encoding": "mp3",
            "speed_ratio": 1.0,
            "volume_ratio": 1.0
        },
        "request": {
            "reqid": os.urandom(8).hex(),
            "text": clean_text,
            "text_type": "plain",
            "operation": "query",
            "with_frontend": 1,
            "frontend_type": "unitTson"
        }
    }

    try:
        response = requests.post(TTS_URL, headers=headers, json=data, timeout=30)
        if response.status_code == 200:
            return response.json().get("data")
        else:
            print(f"TTS 失败：{response.status_code}")
            return None
    except Exception as e:
        print(f"TTS 异常：{e}")
        return None

# ---------- Flet 应用（移动端适配） ----------
def main(page: ft.Page):
    page.title = "灵溪"
    page.theme_mode = "light"
    page.padding = 10
    page.window_width = 420
    page.window_height = 750
    page.bgcolor = "#f0f4f8"

    # 音频播放组件（安卓支持 mp3）
    audio_player = ft.Audio(src="")
    page.overlay.append(audio_player)

    # 顶部导航栏
    app_bar = ft.Container(
        content=ft.Row(
            controls=[
                ft.Text("💬", size=30),
                ft.Text("灵溪", size=24, weight="bold", color="white"),
            ],
            alignment=ft.MainAxisAlignment.START,
            spacing=10,
        ),
        padding=15,
        margin=0,
        bgcolor="#4a90d9",
    )

    # 聊天显示区域
    chat_display = ft.Column(
        spacing=15,
        scroll=ft.ScrollMode.AUTO,
        expand=True,
    )
    chat_wrapper = ft.Container(
        content=chat_display,
        padding=10,
        expand=True,
    )

    # 输入框和发送按钮
    input_field = ft.TextField(
        hint_text="说点什么...",
        expand=True,
        border_radius=30,
        filled=True,
        bgcolor="white",
        border_color="#4a90d9",
        on_submit=lambda e: send_message(),
    )
    send_btn = ft.Container(
        content=ft.Text("发送", color="white", size=14, weight="bold"),
        bgcolor="#4a90d9",
        padding=16,
        border_radius=20,
        on_click=lambda e: send_message(),
    )

    # ---------- 音频播放辅助 ----------
    def play_audio(base64_audio: str):
        if not base64_audio:
            return
        try:
            audio_bytes = base64.b64decode(base64_audio)
            # 使用临时文件，安卓可读写
            with tempfile.NamedTemporaryFile(delete=False, suffix=".mp3") as tmp:
                tmp.write(audio_bytes)
                tmp_path = tmp.name
            audio_player.src = tmp_path
            audio_player.play()
            # 延迟删除文件（播放开始后即可删）
            async def delete_later():
                await asyncio.sleep(3)
                try:
                    os.unlink(tmp_path)
                except:
                    pass
            asyncio.create_task(delete_later())
        except Exception as e:
            print(f"播放异常：{e}")

    # ---------- 发送消息核心 ----------
    def send_message():
        user_text = input_field.value
        if not user_text:
            return

        input_field.value = ""
        page.update()

        # 获取窗口宽度（移动端自适应）
        win_w = page.window_width or 400

        # 显示用户消息
        chat_display.controls.append(
            ft.Row(
                controls=[
                    ft.Container(
                        content=ft.Text(user_text, size=15, color="black"),
                        bgcolor="#d1e7ff",
                        padding=15,
                        border_radius=20,
                        width=win_w * 0.7,
                    )
                ],
                alignment=ft.MainAxisAlignment.END,
            )
        )
        page.update()

        # “正在输入……”
        typing = ft.Row(
            controls=[
                ft.Container(
                    content=ft.Text("灵溪正在输入...", italic=True, size=14, color="#757575"),
                    padding=10,
                )
            ],
            alignment=ft.MainAxisAlignment.START,
        )
        chat_display.controls.append(typing)
        page.update()

        # 获取 AI 回复
        reply = get_reply(user_text)

        # 移除“正在输入……”
        chat_display.controls.remove(typing)

        # 显示 AI 回复
        chat_display.controls.append(
            ft.Row(
                controls=[
                    ft.CircleAvatar(
                        content=ft.Text("🌊", size=20),
                        bgcolor="#4a90d9",
                        radius=18,
                    ),
                    ft.Container(
                        content=ft.Text(reply, size=15, color="black"),
                        bgcolor="white",
                        padding=15,
                        border_radius=20,
                        width=win_w * 0.65,
                    ),
                ],
                alignment=ft.MainAxisAlignment.START,
                spacing=8,
            )
        )
        page.update()

        # 语音合成并播放
        try:
            audio_base64 = tts_speak(reply)
            if audio_base64:
                play_audio(audio_base64)
        except Exception as e:
            print(f"语音处理失败：{e}")

    # 底部输入栏
    input_row = ft.Container(
        content=ft.Row(
            controls=[input_field, send_btn],
            spacing=10,
            alignment=ft.MainAxisAlignment.CENTER,
        ),
        padding=10,
        bgcolor="#f0f4f8",
    )

    page.add(app_bar, chat_wrapper, input_row)

if __name__ == "__main__":
    ft.app(target=main)
