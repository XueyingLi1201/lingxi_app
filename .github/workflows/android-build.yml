name: Build Flet Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  FLUTTER_VERSION: '3.22.0'   # 选择一个稳定版本

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            pip install flet
          fi
          pip list

      # 🔧 安装 Flutter（关键！）
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Check Flutter
        run: flutter doctor -v

      # ☕ 安装 Java（Android 构建需要）
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          # 禁用缓存，避免找不到 Gradle 文件的错误（因为后面会由 Flutter 生成）
          cache: 'none'

      # 🔑 注入 API Key
      - name: Inject API Keys
        run: |
          cat > config.py <<EOF
          # 由 GitHub Actions 自动生成
          DEEPSEEK_API_KEY = "${{ secrets.DEEPSEEK_API_KEY }}"
          TTS_API_KEY = "${{ secrets.TTS_API_KEY || 'e9690219-6f03-4a0f-906b-f29ce8bd3c45' }}"
          EOF

      # 🚀 构建 APK
      - name: Build APK
        run: |
          flet build apk --entry-file lingxi_app.py --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lingxi-App
          path: build/apk
